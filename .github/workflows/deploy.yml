name: Deploy docs to GitHub Pages

# Si pubblica solo da `main`, e `main` lo mergia solo una persona (forma (a), ADO O2):
# `dev` e' il ramo di integrazione e un push su `dev` non cambia il sito pubblico.
# La verifica che il sito compili su `dev` sta in build-check.yml, senza deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    # Seconda cintura: un workflow_dispatch lanciato da un altro ramo non pubblica.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5